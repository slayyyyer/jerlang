plugins {
    id 'application'
}

// The published artifact, as in http-service and chat-service.
repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.github.slayyyyer:jerlang:2.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'example.MnesiaServer'
}

def ebin = layout.buildDirectory.dir('ebin')
def erlangOut = layout.buildDirectory.dir('erlang')

// Only the service's own module is compiled here, by JErlang. The module on the
// other node is compiled by the OTP installation that runs it; see its README.
def java21 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

tasks.register('compileErlang', JavaExec) {
    description = 'Compiles the Erlang sources of the service with JErlang.'
    group = 'build'
    def sources = fileTree('src/main/erl') { include '**/*.erl' }
    inputs.files sources
    outputs.dir ebin
    classpath = configurations.compileClasspath
    javaLauncher.set(java21)
    mainClass = 'org.jerlang.compiler.CompilerCommand'
    args = ['-o', erlangOut.get().asFile.absolutePath] + sources.files.collect { it.absolutePath }
    doFirst {
        delete ebin.get().asFile
        delete erlangOut.get().asFile
    }
    doLast {
        project.copy {
            from erlangOut.get().asFile
            into ebin.get().asFile
        }
    }
}

tasks.named('classes') {
    dependsOn 'compileErlang'
}

tasks.named('run') {
    systemProperty 'jerlang.example.ebin', ebin.get().asFile.absolutePath
    systemProperty 'jerlang.example.port', providers.gradleProperty('port').getOrElse('8080')
    systemProperty 'jerlang.example.nodename', providers.gradleProperty('nodename').getOrElse('mnesia_http')
    systemProperty 'jerlang.example.cookie', providers.gradleProperty('cookie').getOrElse('examplecookie')
    if (providers.gradleProperty('peer').isPresent()) {
        systemProperty 'jerlang.example.peer', providers.gradleProperty('peer').get()
    }
}
