name: Tests

on:
  # Every branch, so a push to a milestone branch is tested without waiting
  # for a pull request. Fork pull requests are still covered by the
  # pull_request event, which does not fire for a push to this repository.
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the test suite
        run: mvn -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  conformance:
    # The pass rate over real OTP modules, which is the number the roadmap
    # tracks. It needs an OTP installation, so it lives in its own job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Measure the conformance pass rate
        run: |
          OTP_ROOT="$(erl -noshell -eval 'io:format("~s", [code:root_dir()]), halt().')"
          echo "OTP root: $OTP_ROOT"
          mvn -B -Dtest=PassRateTest -Djerlang.conformance.dir="$OTP_ROOT/lib" test
