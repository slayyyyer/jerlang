site_name: JErlang
site_description: An Erlang runtime for the Java Virtual Machine
site_url: https://slayyyyer.github.io/jerlang/
repo_url: https://github.com/slayyyyer/jerlang
repo_name: slayyyyer/jerlang
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site
copyright: Apache 2.0

theme:
  name: material
  language: en
  font:
    text: Space Grotesk
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Examples:
      - Java calls Erlang: examples/gen-server.md
      - Erlang calls Java: examples/java-service.md
      - Erlang HTTP service from Gradle: examples/http-service.md
      - A chat service over SSE: examples/chat-service.md
      - mnesia over distribution: examples/mnesia-service.md
      - Testing Erlang from JUnit: examples/junit-harness.md
      - Supervision from Java: examples/supervised-app.md
  - Guides:
      - Java interoperability: java-interop.md
      - Distribution: distribution.md
      - Operating a node: operations.md
      - BEAM compatibility: beam-compatibility.md
      - Benchmarks: benchmarks.md
  - Project:
      - Roadmap: roadmap.md
      - Compiling Erlang: compiler.md
      - Releasing: release.md
