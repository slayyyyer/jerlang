name: Tests

on:
  # Every branch, so a push to a milestone branch is tested without waiting
  # for a pull request. Fork pull requests are still covered by the
  # pull_request event, which does not fire for a push to this repository.
  push:
  pull_request:
    branches: [master]
  # The nightly soak. A hosted runner is killed after six hours, so this is the
  # long run that fits; the 24 hour run is deferred and is not a 3.0.0 gate.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the test suite and API gate
        run: mvn -B verify

      - name: Verify the thin library artifact
        run: |
          thin="$(find target -maxdepth 1 -name 'jerlang-*.jar' \
            ! -name '*-all.jar' ! -name 'original-*' \
            ! -name '*-javadoc.jar' ! -name '*-sources.jar' \
            ! -name '*-tests.jar' -print -quit)"
          test -n "$thin"
          echo "thin artifact: $thin"
          if jar tf "$thin" | grep -Eq '^(jnr|jline|com/jcraft|org/apache/commons/math3)(/|$)'; then
            echo "thin artifact contains bundled dependency classes" >&2
            exit 1
          fi

      - name: Smoke-test the runnable jar
        run: |
          mkdir -p target/jar-smoke/src target/jar-smoke/out
          printf '%s\n' '-module(jar_smoke).' '-export([value/0]).' 'value() -> 42.' \
            > target/jar-smoke/src/jar_smoke.erl
          jar="$(find target -maxdepth 1 -name 'jerlang-*-all.jar' -print -quit)"
          test -n "$jar"
          java -jar "$jar" compile -o target/jar-smoke/out target/jar-smoke/src/jar_smoke.erl
          test -f target/jar-smoke/out/jar_smoke.beam

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  examples:
    # The two checked-in examples, one per direction of the Java interop. They
    # are compiled from source here, so a broken example can not hide behind a
    # stale build. The gen_server one runs OTP's own server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Compile the runtime
        run: mvn -B -DskipTests compile

      - name: Run the examples
        run: bash examples/run.sh

  maven-embed:
    # E1: a consumer build compiles .erl with JErlang and runs it on a JDK
    # alone. The broken tool paths make a fallback to erlc/erl fail instead of
    # succeeding if the runner happens to have Erlang installed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install the library under test
        run: mvn -B -DskipTests install

      - name: Compile and test without an Erlang toolchain
        env:
          ERLC: /nonexistent/erlc
          ERL: /nonexistent/erl
        run: cd examples/maven-embed && mvn -B clean verify

      - name: Check the consumer dependency tree
        run: |
          tree="$(cd examples/maven-embed && mvn -B dependency:tree -Dincludes=io.github.slayyyyer:jerlang)"
          printf '%s\n' "$tree"
          count="$(printf '%s\n' "$tree" | grep -c 'io.github.slayyyyer:jerlang:jar:3.0.0' || true)"
          test "$count" -eq 1

  otp:
    # The standard library boot tests run OTP's own gen_server, supervisor,
    # application, proc_lib and logger modules, so they need an Erlang
    # installation. Without this job the milestone's exit test is green only
    # on a developer machine: the test classes skip themselves when
    # -Djerlang.otp.dir is not set.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Run the OTP-backed tests
        run: |
          OTP_ROOT="$(erl -noshell -eval 'io:format("~s", [code:root_dir()]), halt().')"
          echo "OTP root: $OTP_ROOT"
          mvn -B \
            -Dtest=ApplicationTest,SupervisorTest,GenServerTest,ProcLibTest,LoggerTest,OtpReconnectTest \
            -Djerlang.otp.dir="$OTP_ROOT" test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: otp-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  conformance:
    # The pass rate over real OTP modules, which is the number the roadmap
    # tracks. It needs an OTP installation, so it lives in its own job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Measure the conformance pass rate
        run: |
          OTP_ROOT="$(erl -noshell -eval 'io:format("~s", [code:root_dir()]), halt().')"
          echo "OTP root: $OTP_ROOT"
          # The floor turns the recorded rate into a gate. From the OTP 29.1.2
          # run the rate is 1.0; 0.99 leaves room for a patch release that
          # ships a module the loader can not read yet without hiding a
          # regression in the bulk of the corpus.
          mvn -B -Dtest=PassRateTest \
            -Djerlang.conformance.dir="$OTP_ROOT/lib" \
            -Djerlang.conformance.min=0.99 test

  bench:
    # The benchmark table from docs/benchmarks.md, measured against a real OTP
    # node in the same job. With the gate on, the roadmap's message throughput
    # budget (no more than 5x BEAM) is enforced instead of reported.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Compare against BEAM
        run: |
          OTP_ROOT="$(erl -noshell -eval 'io:format("~s", [code:root_dir()]), halt().')"
          mvn -B \
            -Dtest=BeamBenchTest \
            -Djerlang.bench=true \
            -Djerlang.bench.gate=true \
            -Djerlang.otp.dir="$OTP_ROOT" test

  fuzz:
    # The checked-in campaign is short; a longer one is a local command, see
    # docs/release.md. Both fuzzers are deterministic, so a failure names the
    # seed and iteration that reproduces it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Fuzz the loader and the term decoder
        run: mvn -B -Dtest=BeamLoaderFuzzTest,EtfFuzzTest -Djerlang.fuzz.iterations=2000 test

  soak:
    # Nightly only: this is the flatness check that a unit test can not make.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the soak
        run: mvn -B -Dtest=SoakTest -Djerlang.soak.seconds=1800 -Djerlang.soak.workers=32 test

  gradle-embed:
    # E2: the Gradle consumer path. The matrix compiles every non-OTP example
    # with no Erlang toolchain on the runner. The broken paths make a fallback
    # to erlc/erl fail instead of succeeding if the runner has Erlang installed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [gradle-embed, junit-harness, http-service, chat-service, mnesia-service, crypto-java, concurrency]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the library under test
        run: mvn -B -DskipTests install

      - name: Write the local artifact repository
        run: |
          cat > "$RUNNER_TEMP/jerlang-local.init.gradle" <<'EOF'
          allprojects {
              repositories {
                  mavenLocal {
                      content {
                          includeGroup 'io.github.slayyyyer'
                      }
                  }
              }
          }
          EOF

      - name: Build without an Erlang toolchain
        env:
          ERLC: /nonexistent/erlc
          ERL: /nonexistent/erl
        run: cd examples/${{ matrix.example }} && gradle --no-daemon --init-script "$RUNNER_TEMP/jerlang-local.init.gradle" test

  concurrency-bench:
    # The same Erlang source runs on both runtimes. The JVM side uses the small
    # checked-in case because the prototype does not reach 100,000 processes in
    # five minutes; BEAM runs the full million. The numbers are reported, not
    # asserted, for the same reason as the other benchmark jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Install the library under test
        run: mvn -B -DskipTests install

      - name: Write the local artifact repository
        run: |
          cat > "$RUNNER_TEMP/jerlang-local.init.gradle" <<'EOF'
          allprojects {
              repositories {
                  mavenLocal {
                      content {
                          includeGroup 'io.github.slayyyyer'
                      }
                  }
              }
          }
          EOF

      - name: Run the JErlang column
        run: |
          cd examples/concurrency
          gradle --no-daemon --init-script "$RUNNER_TEMP/jerlang-local.init.gradle" \
            run --args="5000 1000 1000"

      - name: Run the BEAM column
        run: |
          mkdir -p examples/concurrency/build/beam
          erlc -o examples/concurrency/build/beam \
            examples/concurrency/src/main/erl/concurrency_demo.erl \
            examples/concurrency/beam_concurrency.erl
          erl -noshell +P 2000000 -pa examples/concurrency/build/beam \
            -s beam_concurrency main

  gradle-examples:
    # The OTP-backed Gradle example still compiles its modules with erlc and
    # needs OTP at run time. The non-OTP examples are covered without OTP in the
    # gradle-embed job; mnesia-service is built here but not run because running
    # it needs a live OTP node.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install the library under test
        run: mvn -B -DskipTests install

      - name: Write the local artifact repository
        run: |
          cat > "$RUNNER_TEMP/jerlang-local.init.gradle" <<'EOF'
          allprojects {
              repositories {
                  mavenLocal {
                      content {
                          includeGroup 'io.github.slayyyyer'
                      }
                  }
              }
          }
          EOF

      - name: junit-harness
        run: cd examples/junit-harness && gradle --no-daemon --init-script "$RUNNER_TEMP/jerlang-local.init.gradle" test

      - name: http-service
        run: cd examples/http-service && gradle --no-daemon --init-script "$RUNNER_TEMP/jerlang-local.init.gradle" installDist

      - name: chat-service
        run: cd examples/chat-service && gradle --no-daemon --init-script "$RUNNER_TEMP/jerlang-local.init.gradle" installDist

      - name: mnesia-service
        run: cd examples/mnesia-service && gradle --no-daemon --init-script "$RUNNER_TEMP/jerlang-local.init.gradle" installDist

      - name: supervised-app
        run: cd examples/supervised-app && gradle --no-daemon --init-script "$RUNNER_TEMP/jerlang-local.init.gradle" installDist
