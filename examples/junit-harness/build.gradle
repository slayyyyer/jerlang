plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.github.slayyyyer:jerlang:3.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The tests call modules compiled by JErlang. A checkout with no Erlang
// installation can still run `gradle test`; there are no committed beams to
// fall back on. The compiler writes to build/erlang and the task replaces
// build/ebin only after a successful compile, so a failed source can not leave
// an older module looking current.
def ebin = layout.buildDirectory.dir('ebin')
def erlangOut = layout.buildDirectory.dir('erlang')
def java21 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

tasks.register('compileErlang', JavaExec) {
    description = 'Compiles the Erlang modules the tests call with JErlang.'
    group = 'build'
    def sources = fileTree('src/main/erl') { include '**/*.erl' }
    inputs.files sources
    outputs.dir ebin
    classpath = configurations.compileClasspath
    javaLauncher.set(java21)
    mainClass = 'org.jerlang.compiler.CompilerCommand'
    args = ['-o', erlangOut.get().asFile.absolutePath] + sources.files.collect { it.absolutePath }
    doFirst {
        delete ebin.get().asFile
        delete erlangOut.get().asFile
    }
    doLast {
        project.copy {
            from erlangOut.get().asFile
            into ebin.get().asFile
        }
    }
}

tasks.named('classes') {
    dependsOn 'compileErlang'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'jerlang.example.ebin', ebin.get().asFile.absolutePath
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = false
    }
}
