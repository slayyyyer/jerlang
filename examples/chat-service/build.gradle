plugins {
    id 'application'
}

// Same as the key-value example: the published artifact, so this is also a check
// that a consumer's build file is enough to run an Erlang service.
repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.github.slayyyyer:jerlang:3.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'example.ChatServer'
}

def ebin = layout.buildDirectory.dir('ebin')
def erlangOut = layout.buildDirectory.dir('erlang')

// JErlang compiles the service from the published artifact; only a JDK is
// needed. The .beam files are loaded from build/ebin at run time.
def java21 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

tasks.register('compileErlang', JavaExec) {
    description = 'Compiles the Erlang sources of the service with JErlang.'
    group = 'build'
    def sources = fileTree('src/main/erl') { include '**/*.erl' }
    inputs.files sources
    outputs.dir ebin
    classpath = configurations.compileClasspath
    javaLauncher.set(java21)
    mainClass = 'org.jerlang.compiler.CompilerCommand'
    args = ['-o', erlangOut.get().asFile.absolutePath] + sources.files.collect { it.absolutePath }
    doFirst {
        delete ebin.get().asFile
        delete erlangOut.get().asFile
    }
    doLast {
        project.copy {
            from erlangOut.get().asFile
            into ebin.get().asFile
        }
    }
}

tasks.named('classes') {
    dependsOn 'compileErlang'
}

tasks.named('run') {
    systemProperty 'jerlang.example.ebin', ebin.get().asFile.absolutePath
    systemProperty 'jerlang.example.port', providers.gradleProperty('port').getOrElse('8080')
    systemProperty 'jerlang.example.clients', providers.gradleProperty('clients').getOrElse('64')
}
