plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.github.slayyyyer:jerlang:3.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'example.MixedCluster'
}

def ebin = layout.buildDirectory.dir('ebin')
def erlangOut = layout.buildDirectory.dir('erlang')
def otpEbin = layout.buildDirectory.dir('otp')
def java21 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

tasks.register('compileErlang', JavaExec) {
    description = 'Compiles the JErlang side with JErlang.'
    group = 'build'
    def sources = fileTree('src/main/erl') { include '**/*.erl' }
    inputs.files sources
    outputs.dir ebin
    classpath = configurations.compileClasspath
    javaLauncher.set(java21)
    mainClass = 'org.jerlang.compiler.CompilerCommand'
    args = ['-o', erlangOut.get().asFile.absolutePath] + sources.files.collect { it.absolutePath }
    doFirst {
        delete ebin.get().asFile
        delete erlangOut.get().asFile
    }
    doLast {
        project.copy {
            from erlangOut.get().asFile
            into ebin.get().asFile
        }
    }
}

tasks.register('compilePeer', Exec) {
    description = 'Compiles the OTP peer with erlc.'
    group = 'build'
    def sources = fileTree('src/otp') { include '**/*.erl' }
    def erlc = System.getenv('ERLC') ?: 'erlc'
    inputs.files sources
    outputs.dir otpEbin
    doFirst {
        otpEbin.get().asFile.mkdirs()
        commandLine([erlc, '-o', otpEbin.get().asFile.absolutePath]
            + sources.files.collect { it.absolutePath })
    }
}

tasks.named('classes') {
    dependsOn 'compileErlang', 'compilePeer'
}

tasks.named('run') {
    systemProperty 'jerlang.example.ebin', ebin.get().asFile.absolutePath
    systemProperty 'jerlang.example.otpEbin', otpEbin.get().asFile.absolutePath
}
