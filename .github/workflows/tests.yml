name: Tests

on:
  # Every branch, so a push to a milestone branch is tested without waiting
  # for a pull request. Fork pull requests are still covered by the
  # pull_request event, which does not fire for a push to this repository.
  push:
  pull_request:
    branches: [master]
  # The nightly soak. A hosted runner is killed after six hours, so this is the
  # long run that fits; the 24 hour gate from docs/release.md runs on a machine
  # that stays up.
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the test suite
        run: mvn -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  examples:
    # The two checked-in examples, one per direction of the Java interop. They
    # are compiled from source here, so a broken example can not hide behind a
    # stale build. The gen_server one runs OTP's own server.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Compile the runtime
        run: mvn -B -DskipTests compile

      - name: Run the examples
        run: bash examples/run.sh

  otp:
    # The standard library boot tests run OTP's own gen_server, supervisor,
    # application, proc_lib and logger modules, so they need an Erlang
    # installation. Without this job the milestone's exit test is green only
    # on a developer machine: the test classes skip themselves when
    # -Djerlang.otp.dir is not set.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Run the OTP-backed tests
        run: |
          OTP_ROOT="$(erl -noshell -eval 'io:format("~s", [code:root_dir()]), halt().')"
          echo "OTP root: $OTP_ROOT"
          mvn -B \
            -Dtest=ApplicationTest,SupervisorTest,GenServerTest,ProcLibTest,LoggerTest,OtpReconnectTest \
            -Djerlang.otp.dir="$OTP_ROOT" test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: otp-surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  conformance:
    # The pass rate over real OTP modules, which is the number the roadmap
    # tracks. It needs an OTP installation, so it lives in its own job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Measure the conformance pass rate
        run: |
          OTP_ROOT="$(erl -noshell -eval 'io:format("~s", [code:root_dir()]), halt().')"
          echo "OTP root: $OTP_ROOT"
          # The floor turns the recorded rate into a gate. From the OTP 29.1.2
          # run the rate is 1.0; 0.99 leaves room for a patch release that
          # ships a module the loader can not read yet without hiding a
          # regression in the bulk of the corpus.
          mvn -B -Dtest=PassRateTest \
            -Djerlang.conformance.dir="$OTP_ROOT/lib" \
            -Djerlang.conformance.min=0.99 test

  bench:
    # The benchmark table from docs/benchmarks.md, measured against a real OTP
    # node in the same job. With the gate on, the roadmap's message throughput
    # budget (no more than 5x BEAM) is enforced instead of reported.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Compare against BEAM
        run: |
          OTP_ROOT="$(erl -noshell -eval 'io:format("~s", [code:root_dir()]), halt().')"
          mvn -B \
            -Dtest=BeamBenchTest \
            -Djerlang.bench=true \
            -Djerlang.bench.gate=true \
            -Djerlang.otp.dir="$OTP_ROOT" test

  fuzz:
    # The checked-in campaign is short; a longer one is a local command, see
    # docs/release.md. Both fuzzers are deterministic, so a failure names the
    # seed and iteration that reproduces it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Fuzz the loader and the term decoder
        run: mvn -B -Dtest=BeamLoaderFuzzTest,EtfFuzzTest -Djerlang.fuzz.iterations=2000 test

  soak:
    # Nightly only: this is the flatness check that a unit test can not make.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run the soak
        run: mvn -B -Dtest=SoakTest -Djerlang.soak.seconds=1800 -Djerlang.soak.workers=32 test

  gradle-examples:
    # The Gradle examples are consumer builds: they resolve the published
    # artifact and compile their own Erlang, so a change to the runtime or to
    # their sources can not hide behind a stale local build. mnesia-service is
    # built here but not run: running it needs a live OTP node.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: junit-harness
        run: cd examples/junit-harness && gradle --no-daemon test

      - name: http-service
        run: cd examples/http-service && gradle --no-daemon installDist

      - name: chat-service
        run: cd examples/chat-service && gradle --no-daemon installDist

      - name: mnesia-service
        run: cd examples/mnesia-service && gradle --no-daemon installDist
